<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">CIFAR-10 architecture found by D-GAENAS</title>
  <desc id="desc">Normal and reduction cells found in the open-domain DARTS search space.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/></marker>
    <style>
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
      .title { font:700 28px Arial, sans-serif; fill:#0f172a; text-anchor:middle; }
      .subtitle { font:16px Arial, sans-serif; fill:#475569; text-anchor:middle; }
      .node { fill:#fff; stroke:#2563eb; stroke-width:3; }
      .input { fill:#eff6ff; stroke:#2563eb; stroke-width:3; }
      .output { fill:#ecfdf5; stroke:#059669; stroke-width:3; }
      .nodeText { font:700 18px Arial, sans-serif; fill:#0f172a; text-anchor:middle; dominant-baseline:middle; }
      .smallText { font:14px Arial, sans-serif; fill:#475569; text-anchor:middle; }
      .edge { fill:none; stroke:#64748b; stroke-width:2.2; marker-end:url(#arrow); }
      .edgeLabel { font:13px Consolas, monospace; fill:#334155; paint-order:stroke; stroke:#f8fafc; stroke-width:5px; stroke-linejoin:round; }
      .legend { font:15px Arial, sans-serif; fill:#475569; text-anchor:middle; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" class="title">Architecture Found by D-GAENAS on CIFAR-10</text>
  <text x="750" y="69" class="subtitle">Open-domain search in the DARTS search space</text>

  <!-- Normal cell -->
  <g transform="translate(25,95)">
    <rect class="panel" x="0" y="0" width="710" height="590" rx="18"/>
    <text x="355" y="42" class="title">Normal Cell</text>

    <circle class="input" cx="75" cy="165" r="34"/><text class="nodeText" x="75" y="165">0</text><text class="smallText" x="75" y="212">c[k-2]</text>
    <circle class="input" cx="75" cy="390" r="34"/><text class="nodeText" x="75" y="390">1</text><text class="smallText" x="75" y="437">c[k-1]</text>
    <circle class="node" cx="275" cy="130" r="32"/><text class="nodeText" x="275" y="130">2</text>
    <circle class="node" cx="425" cy="235" r="32"/><text class="nodeText" x="425" y="235">3</text>
    <circle class="node" cx="275" cy="430" r="32"/><text class="nodeText" x="275" y="430">4</text>
    <circle class="node" cx="425" cy="95" r="32"/><text class="nodeText" x="425" y="95">5</text>
    <rect class="output" x="585" y="238" width="92" height="66" rx="16"/><text class="nodeText" x="631" y="265">concat</text><text class="smallText" x="631" y="288">2, 3, 4, 5</text>

    <path class="edge" d="M108 159 L241 136"/><text class="edgeLabel" x="137" y="135">sep_conv_5x5</text>
    <path class="edge" d="M102 372 Q170 255 248 151"/><text class="edgeLabel" x="123" y="278">sep_conv_3x3</text>
    <path class="edge" d="M105 176 Q260 190 394 226"/><text class="edgeLabel" x="205" y="187">sep_conv_5x5</text>
    <path class="edge" d="M300 151 L400 215"/><text class="edgeLabel" x="318" y="204">dil_conv_5x5</text>
    <path class="edge" d="M97 190 Q155 315 250 410"/><text class="edgeLabel" x="113" y="330">max_pool_3x3</text>
    <path class="edge" d="M108 397 L241 423"/><text class="edgeLabel" x="130" y="438">sep_conv_3x3</text>
    <path class="edge" d="M108 154 Q260 80 393 92"/><text class="edgeLabel" x="200" y="85">skip_connect</text>
    <path class="edge" d="M307 122 L393 102"/><text class="edgeLabel" x="318" y="91">sep_conv_5x5</text>

    <path class="edge" d="M306 142 Q470 170 585 253"/>
    <path class="edge" d="M457 240 L585 263"/>
    <path class="edge" d="M305 417 Q480 370 588 298"/>
    <path class="edge" d="M455 110 Q545 150 604 239"/>
  </g>

  <!-- Reduction cell -->
  <g transform="translate(765,95)">
    <rect class="panel" x="0" y="0" width="710" height="590" rx="18"/>
    <text x="355" y="42" class="title">Reduction Cell</text>

    <circle class="input" cx="75" cy="165" r="34"/><text class="nodeText" x="75" y="165">0</text><text class="smallText" x="75" y="212">c[k-2]</text>
    <circle class="input" cx="75" cy="390" r="34"/><text class="nodeText" x="75" y="390">1</text><text class="smallText" x="75" y="437">c[k-1]</text>
    <circle class="node" cx="275" cy="130" r="32"/><text class="nodeText" x="275" y="130">2</text>
    <circle class="node" cx="425" cy="235" r="32"/><text class="nodeText" x="425" y="235">3</text>
    <circle class="node" cx="275" cy="430" r="32"/><text class="nodeText" x="275" y="430">4</text>
    <circle class="node" cx="425" cy="95" r="32"/><text class="nodeText" x="425" y="95">5</text>
    <rect class="output" x="585" y="238" width="92" height="66" rx="16"/><text class="nodeText" x="631" y="265">concat</text><text class="smallText" x="631" y="288">2, 3, 4, 5</text>

    <path class="edge" d="M108 159 L241 136"/><text class="edgeLabel" x="137" y="135">sep_conv_5x5</text>
    <path class="edge" d="M102 372 Q170 255 248 151"/><text class="edgeLabel" x="123" y="278">sep_conv_5x5</text>
    <path class="edge" d="M105 176 Q260 190 394 226"/><text class="edgeLabel" x="205" y="187">max_pool_3x3</text>
    <path class="edge" d="M300 151 L400 215"/><text class="edgeLabel" x="318" y="204">max_pool_3x3</text>
    <path class="edge" d="M97 190 Q155 315 250 410"/><text class="edgeLabel" x="113" y="330">dil_conv_3x3</text>
    <path class="edge" d="M108 397 L241 423"/><text class="edgeLabel" x="130" y="438">dil_conv_5x5</text>
    <path class="edge" d="M108 154 Q260 80 393 92"/><text class="edgeLabel" x="200" y="85">skip_connect</text>
    <path class="edge" d="M307 122 L393 102"/><text class="edgeLabel" x="318" y="91">sep_conv_5x5</text>

    <path class="edge" d="M306 142 Q470 170 585 253"/>
    <path class="edge" d="M457 240 L585 263"/>
    <path class="edge" d="M305 417 Q480 370 588 298"/>
    <path class="edge" d="M455 110 Q545 150 604 239"/>
  </g>

  <text x="750" y="724" class="legend">Each intermediate node sums two incoming operations; the outputs of nodes 2-5 are concatenated.</text>
</svg>
